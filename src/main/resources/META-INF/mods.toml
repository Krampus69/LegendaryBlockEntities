modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "LGPL-3.0-only"
issueTrackerURL = "https://github.com/krampus/LegendaryBlockEntities/issues"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
authors = "${mod_authors}"
description = '''${mod_description}

Forge port by Krampus. Original mod: Enhanced Block Entities by FoundationGames (https://github.com/FoundationGames/EnhancedBlockEntities), licensed LGPL-3.0.'''
displayURL = "https://github.com/krampus/LegendaryBlockEntities"

# Client-only mod
[[dependencies.${mod_id}]]
    modId = "forge"
    mandatory = true
    versionRange = "${forge_version_range}"
    ordering = "NONE"
    side = "CLIENT"

[[dependencies.${mod_id}]]
    modId = "minecraft"
    mandatory = true
    versionRange = "${minecraft_version_range}"
    ordering = "NONE"
    side = "CLIENT"
